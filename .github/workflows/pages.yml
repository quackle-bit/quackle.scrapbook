# Publishes Quackle Scrapbook to GitHub Pages as plain static files.
# quacklebit.com is this account's Pages site, so this repo is served at quacklebit.com/<repo-name>
# (rename the repo to "scrapbook" for quacklebit.com/scrapbook). One-time setup: Settings -> Pages ->
# Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run content:lint
      # Pages has no server: drop the parts that need one (Claude Appraiser, login/Studio, Jam rooms,
      # the Pitch Wall and the old street). Everything else runs in the browser.
      - name: Remove server-only routes
        run: rm -rf src/app/api src/app/auth src/app/studio src/app/jam src/app/wall src/app/play
      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
